[package]
name = "agy-t3-sync"
version = "0.1.0"
edition = "2021"
description = "Cross-platform Antigravity account sync, quota auto-rotator, and idle-safe T3 Code restarter"
license = "MIT"
repository = "https://github.com/samudrareggi/agy-t3-sync"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "5"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
